name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: UI smoke tests (Playwright, built app)
        run: npm run test:ui

      - name: Accessibility gate (axe-core, WCAG A/AA, built app)
        run: npm run test:a11y

      # E-K-09 mutation gate. Nineteen named load-bearing edits, each applied on
      # its own to a clean tree, each required to be caught by ONE named owning
      # check, each source restored byte for byte afterwards. Fifteen use pure
      # checks; four src/main.ts edits are owned by browser tests, so they need the browser
      # installed above, and the harness asserts the built bundle hash actually moved -- a
      # mutation the build never picked up is indistinguishable from one nothing
      # caught.
      - name: Mutation gate (knapsack exhibit)
        run: npm run test:mutations

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
